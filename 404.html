<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --fg:#1f2a2c; --muted:#5f6b6c; --line:#dfe3e0;
  --accent:#1f8c86; --accent-soft:#dcefed; --on-accent:#ffffff;
  --body:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Noto Sans JP","PingFang SC","Microsoft YaHei",sans-serif;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Noto Serif JP","Songti SC",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121818; --surface:#1a2222; --fg:#e6ecea; --muted:#9aa8a6; --line:#2c3837;
  --accent:#5cc4bd; --accent-soft:#1d3433; --on-accent:#0f1515; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121818; --surface:#1a2222; --fg:#e6ecea; --muted:#9aa8a6; --line:#2c3837;
  --accent:#5cc4bd; --accent-soft:#1d3433; --on-accent:#0f1515; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.85}
img{display:block;width:100%;height:auto}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.logo{font-family:var(--display);letter-spacing:.12em;font-size:1rem}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:2px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hero{position:relative}
.hero img{aspect-ratio:4/5;object-fit:cover;max-height:88vh}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:48px 16px 28px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff}
.hero h1{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.35;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0 0 16px;font-size:.95rem}
.btn{display:inline-block;text-decoration:none;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:10px 24px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
section{padding:56px 0;border-bottom:1px solid var(--line)}
h2{font-family:var(--display);font-size:1.45rem;line-height:1.45;margin:0 0 20px;text-wrap:balance}
p{margin:0 0 14px}
.round{border-radius:12px;overflow:hidden}
.flow{display:grid;gap:28px}
.step{display:grid;gap:12px}
.step .num{font-family:var(--display);color:var(--accent);font-size:.95rem}
.step h3{margin:0;font-size:1.1rem}
.step p{margin:0;color:var(--muted)}
.price{display:grid;gap:12px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.course .name{font-family:var(--display);font-weight:500;font-size:1.7rem;letter-spacing:.04em;line-height:1.2;margin:0 0 4px}
.course .sub{color:var(--muted);font-size:.9rem}
.course .yen{font-family:var(--display);font-size:1.4rem;margin-top:6px;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.9rem}
.person{display:grid;gap:14px;margin-bottom:28px}
.person img{max-width:280px}
.person .who{font-weight:700;font-size:1.1rem}
.photo-wait{max-width:280px;aspect-ratio:4/5;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
dl.faq{margin:0}
.faq dt{font-weight:700;margin-top:18px}
.faq dd{margin:4px 0 0;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
footer{padding:32px 0 48px;color:var(--muted);font-size:.85rem;text-align:center}
@media (min-width:640px){
  .step{grid-template-columns:240px 1fr;align-items:center}
  .person{grid-template-columns:200px 1fr;align-items:start}
}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.pair h3{font-family:var(--display);font-size:1.05rem;margin:0 0 4px;color:var(--accent)}
.pair p{font-size:.85rem;color:var(--muted);margin:0;line-height:1.7}
.course.sig{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.course .tag{display:inline-block;font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;margin-bottom:6px}
@media (min-width:720px){.pairs{grid-template-columns:repeat(3,1fr)}}
.notes{margin:12px 0 0;padding-left:1.2em;color:var(--muted);font-size:.9rem}
.notes li{margin:4px 0}

/* layout v2: scannable salon page */
section.alt{background:var(--surface)}
section.bare{border-bottom:0;padding:40px 0 0}
.kicker{font-size:.72rem;letter-spacing:.22em;color:var(--accent);font-weight:700;margin-bottom:6px}
h2{font-size:clamp(1.5rem,5.4vw,1.9rem)}
p.lead{font-family:var(--display);font-size:1.12rem;line-height:1.9;color:var(--fg)}
.facts{background:var(--accent);color:var(--on-accent)}
.facts .wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:0}
.fact{padding:16px 14px;text-align:center;background:var(--accent);box-shadow:0 0 0 .5px color-mix(in srgb,var(--on-accent) 25%,transparent)}
.fact b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.3}
.fact span{display:block;font-size:.78rem;opacity:.9;line-height:1.5;margin-top:2px}
@media (min-width:720px){.facts .wrap{grid-template-columns:repeat(4,1fr)}}
blockquote.host{margin:24px 0;padding:4px 0 4px 16px;border-left:3px solid var(--accent);font-family:var(--display);font-size:1.02rem;line-height:1.9}
.info,.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:18px}
section.alt .info,section.alt .box{background:var(--bg)}
section:not(.alt) .info,section:not(.alt) .box{background:var(--surface)}
.info h4,.box h4{margin:0 0 6px;font-size:.95rem;color:var(--accent)}
.box p{margin:0;font-size:.92rem;color:var(--muted)}
ul.ticks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem}
ul.ticks li{position:relative;padding-left:1.3em;line-height:1.7}
ul.ticks li::before{content:"";position:absolute;left:0;top:.62em;width:.5em;height:.5em;border-radius:50%;background:var(--accent)}
.step .num{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.step .num span{font-size:1.6rem;line-height:1;font-family:var(--display);color:var(--accent)}
.step .num em{font-style:normal;font-size:.8rem;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px}
.step h3{font-family:var(--display);font-size:1.2rem;margin:2px 0 6px}
.extras{grid-column:1/-1;display:grid;gap:0}
@media (min-width:640px){.extras{grid-template-columns:1fr 1fr;gap:12px}.extras .box{margin-top:6px}}
.role{color:var(--accent);font-size:.9rem;font-weight:700;margin:-2px 0 10px}
h4.career{margin:16px 0 8px;font-size:.92rem}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:14px 28px 14px 0;font-weight:700;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:10px;font-size:1.3rem;color:var(--accent);font-weight:400}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0 0 14px;color:var(--muted)}
section.closing{text-align:center;border-bottom:0}
section.closing .cta{justify-content:center}
.person .who{font-family:var(--display);font-size:1.4rem;margin:0 0 2px}
.faq.fold{border-top:1px solid var(--line)}
.faq.fold summary{color:var(--accent)}
.faq.fold details ul.ticks{margin:0 0 16px}

.logo{white-space:nowrap;text-decoration:none;color:var(--fg)}
.langs a{font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:2px 10px;text-decoration:none}
.langs a[aria-current]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:400px){.logo{font-size:.85rem;letter-spacing:.06em}.langs{flex-wrap:nowrap;gap:3px}.langs a{padding:1px 6px;font-size:.72rem}}
ol.book{margin:0;padding-left:1.4em;display:grid;gap:8px}
.more{display:inline-block;margin-top:14px}
.doc h1{font-family:var(--display);font-size:1.6rem;margin:32px 0 8px}
.doc h2{margin-top:28px;margin-bottom:10px;font-size:1.2rem}
.doc ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.doc li.plain{list-style:none;margin-left:-1.2em}
table.legal{width:100%;border-collapse:collapse;font-size:.92rem}
table.legal th,table.legal td{border-top:1px solid var(--line);padding:10px 6px;text-align:left;vertical-align:top}
table.legal th{width:34%;font-weight:700}
footer nav{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-bottom:10px}
footer a{color:var(--muted)}
.stores{display:grid;gap:12px}
.store{display:block;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.store .n{font-family:var(--display);font-size:1.2rem;letter-spacing:.08em}
.store .s{color:var(--muted);font-size:.9rem}
</style>
</head>
